services:
    nginx:
        image: dhi.io/nginx:1.29.7-debian13-dev
        ports:
            - "${WEB_PORT:-8080}:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
            # Media and static files
            - static_files:/static
            - ./data:/data
        depends_on:
            - web
        profiles: ["nginx"]
    web:
        build:
            context: .
            target: dev
        # user: "${DOCKER_WEB_USER:-bca}"
        restart: always
        env_file: [.env]
        command: ["./entrypoint.sh"]
        ports:
            - 8000:8000
        volumes:
            - ./entrypoint.sh:/usr/src/app/entrypoint.sh
            # Update Django files in real-time
            - .:/usr/src/app
            # Media and static files
            - static_files:/usr/src/app/static
            - ./data:/usr/src/app/data
            # Postgres files
            - ./.pgpass:/postgres/.pgpass:ro
            - ./.pg_service.conf:/postgres/.pg_service.conf:ro
        environment:
            - PGPASSFILE=/postgres/.pgpass
            - PGSERVICEFILE=/postgres/.pg_service.conf
volumes:
    static_files:
